# Vérification automatique sur Linux et Windows (GitHub Actions, gratuit pour un dépôt public).
# Aucun secret, aucun déploiement, aucun accès en écriture : lecture du code, installation des
# outils figés par package-lock.json, puis suites de tests et audit des dépendances.
name: Vérification Linux et Windows

on:
  push:
    branches: ['claude/**']
  pull_request:
    branches: [v2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suites:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Fins de ligne identiques à la procédure (LF)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Versions
        run: |
          node --version
          npm --version
      - name: Installation (package-lock.json, sans scripts d’installation)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Backend, STUDIO et concurrence
        if: ${{ !cancelled() }}
        run: npm run test:backend
      - name: Boutique
        if: ${{ !cancelled() }}
        run: npm run --if-present test:frontend
      - name: Prototype de stock
        if: ${{ !cancelled() }}
        run: npm run --if-present test:inventory
      - name: Intégration boutique et backend
        if: ${{ !cancelled() }}
        run: npm run --if-present test:integration
      - name: Revue de Work
        if: ${{ !cancelled() }}
        run: npm run --if-present test:review
      - name: Revue v1.3 de Work
        if: ${{ !cancelled() }}
        run: npm run --if-present test:review:v13
      - name: Revue v1.4 de Work (6 régressions)
        if: ${{ !cancelled() }}
        run: npm run test:review:v14
      - name: Risque V14-R1 (e-mail Resend après 24 h), désormais obligatoire
        if: ${{ !cancelled() }}
        run: npm run test:review:risks
      - name: Contre-audit push de Work (intégrité, mise à jour, six critères R1 à R5)
        if: ${{ !cancelled() }}
        run: npm run test:review:push
      - name: Second contre-audit push de Work (migrations, Wrangler local, réception, P2-R1 à P2-R4)
        if: ${{ !cancelled() }}
        run: npm run test:review:push2
      - name: Troisième contre-audit push de Work (intégrité, P3-R1a et P3-R1b)
        if: ${{ !cancelled() }}
        run: npm run test:review:push3
      - name: Transport D1 strict (130 réponses de webhook, aucune erreur locale)
        if: ${{ !cancelled() }}
        run: npm run test:review:d1
      - name: Face ID avec la vérification SimpleWebAuthn activée
        if: ${{ !cancelled() }}
        run: npm run test:webauthn:bibliotheque
      - name: Boutique compilée, ordinaire et TEST fermée
        if: ${{ !cancelled() }}
        env:
          SAYLESS_TEST_ORIGIN: https://sayless-boutique-test.pages.dev
        run: |
          npm run build:storefront
          npm run build:storefront:test
      - name: Compilation Cloudflare (sans déploiement)
        if: ${{ !cancelled() }}
        run: npm run check:cloudflare
      - name: Limites de l’offre gratuite (taille des bundles, aucun nodejs_compat)
        if: ${{ !cancelled() }}
        run: node scripts/check-free-plan.mjs
      - name: Audit des dépendances livrées (zéro exigé)
        if: ${{ !cancelled() }}
        run: npm audit --omit=dev
      - name: Audit complet (zéro exigé)
        if: ${{ !cancelled() }}
        run: npm audit
